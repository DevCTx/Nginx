# ==========================================================================
# nginx/webapp.conf
# Site configuration used BOTH locally and by the GitHub Actions workflow.
# Roles: web server · reverse proxy · load balancer · cache · gzip
# ==========================================================================

# Custom log format: shows which backend served each request + cache status
log_format upstreamlog '$remote_addr -> $upstream_addr '
                       '[$status] "$request" '
                       'cache=$upstream_cache_status';

# CACHE MANAGER
proxy_cache_path /var/cache/nginx/webapp
    levels=1:2 keys_zone=app_cache:10m max_size=500m inactive=60m use_temp_path=off;

# LOAD BALANCER CLUSTER
upstream webapp_cluster {
    least_conn;
    server localhost:3001;
    server localhost:3002;
    server localhost:3003;
}

# WEB SERVER + REVERSE PROXY
server {
    listen 8080;
    server_name localhost;
    access_log /var/log/nginx/webapp.log upstreamlog;

    # COMPRESSION
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json
               application/javascript image/svg+xml;

    location / {
        proxy_pass http://webapp_cluster;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CACHE
        # express.static sends "Cache-Control: max-age=0", which would stop
        # NGINX from caching. Ignore it so our proxy_cache_valid rules apply.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache app_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Cache-free path used to observe / test load balancing
    location /lb-test {
        proxy_pass http://webapp_cluster;
        proxy_cache off;
    }
}
